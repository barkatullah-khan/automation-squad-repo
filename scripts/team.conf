#!/usr/bin/env bash

# Automation Squad - Team Configuration

# Project information
TEAM_NAME="Automation Squad"

# Project base directory
BASE_DIR="/opt/automation-squad"

# Nginx published website directory
LIVE_DIR="/opt/automation-squad/site/live"

# Current published website
CURRENT_DIR="/opt/automation-squad/site"

# Nginx configuration logs
NGINX_ACCESS_LOG="/var/log/nginx/automation-squad.access.log"
NGINX_ERROR_LOG="/var/log/nginx/automation-squad.error.log"

# Report and status files
STATUS_FILE="$LIVE_DIR/status.html"
REPORT_FILE="$LIVE_DIR/report.html"

# Deployment information
DEPLOY_LOG="$BASE_DIR/deploys.log"

# Thresholds
DISK_WARNING_THRESHOLD=80
MAX_TOP_PAGES=5
