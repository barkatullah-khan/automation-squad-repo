#!/usr/bin/env bash

# Project information
TEAM_NAME="Automation Squad"

# Main directories
BASE_DIR="/opt/automation-squad"
SCRIPT_DIR="/opt/automation-squad/scripts"
SITE_DIR="/opt/automation-squad/site"
LIVE_DIR="$SITE_DIR/live"

# Status and report files
STATUS_FILE="$LIVE_DIR/status.html"
REPORT_FILE="$LIVE_DIR/report.html"

# Deployment information
CURRENT_DIR="$SITE_DIR"
DEPLOY_LOG="$BASE_DIR/deploys.log"

# Nginx logs
NGINX_ACCESS_LOG="/var/log/nginx/access.log"
NGINX_ERROR_LOG="/var/log/nginx/automation-squad.error.log"

# Monitoring settings
DISK_WARNING_THRESHOLD=80
MAX_TOP_PAGES=5
